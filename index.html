<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Checkout</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .btn { background-color: #007bff; color: white; padding: 15px 25px; border-radius: 10px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Redirecting to UPI...</h2>
        <p>Please wait a moment.</p>
        <a href="upi://pay?pa=gpay-12200225609@okbizaxis&pn=GPay%20Business&mc=0000&tr=ORDER12345&tn=Payment&am=1.00&cu=INR" class="btn">Pay ₹1.00 Now</a>
    </div>
    <script>
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "upi://pay?pa=gpay-12200225609@okbizaxis&pn=GPay%20Business&mc=0000&tr=ORDER12345&tn=Payment&am=1.00&cu=INR";
            }, 1000);
        };
    </script>
</body>
</html>
